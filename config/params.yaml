map:
  pixel_size_m: 0.05 # Pixel side length [m]
  voxel_size_m: 0.5 # Voxel side length [m]
  normal_tolerance_deg: 3 # Normal change threshold to trigger reprojection of voxel image [°]
  smooth: True # Apply smoothing to the voxel image
  weighted: True # Weighted pixel update
  max_size: 1500000 # Maximum number of voxels to keep in the map
  frame: "odom" # World-fixed parent frame of the published odometry and clouds

preprocess:
  downsample_resolution_m: 0.1 # Downsample points to this resolution [m]. In case of informed sampling, this
  # corresponds to the high resolution voxels
  informed_sampling: True

optimization:
  huber_delta: 0.1 # Huber norm threshold

# Sensor-config files own the topic names; these are how they are subscribed to.
topics:
  # false = best-effort. Best-effort is compatible with reliable publishers too, and is the
  # right default for live sensor data: a lost scan costs one update, a late scan drags the
  # estimate behind reality. Set true when the publisher is across a link that loses
  # fragments -- a MID-360 PointCloud2 is around half a megabyte, so UDP splits it into
  # hundreds of datagrams and losing one discards the whole scan.
  qos_reliable: false
  pointcloud_queue_depth: 20
  # 200 samples is a full second at 200 Hz. The sensor-data default of 5 is 25 ms, short
  # enough that any stall in the callback thread costs samples the de-skewing needs.
  imu_queue_depth: 200

imu:
    window_s: 10 # Time window for the inertial optimization [s]
    t_init: 0.2 # Time to initialize bias and gravity [s]
    frame: "imu" # IMU body frame: the child frame of the published odometry and TF

# Sensor-config files own min_range_m / max_range_m; `frame` is set here because it is a
# property of the robot's TF tree rather than of the sensor model. Leaf keys merge across
# the two files, so a sensor config may still override it.
lidar:
  # Names the LiDAR link. Nothing is published in it: it is the source frame of the
  # lidar -> base lookup the `base` switches below read from TF, and the child of the
  # optional static transform under `publish`.
  frame: "lidar"
  # true: accept a cloud that carries no per-point time field (t / time / timestamp) and
  # read the whole scan as taken at one instant. Off by default, because on a real spinning
  # sensor those times are what de-skewing runs on and treating a swept scan as
  # instantaneous bends the map while the odometry still looks plausible. Turn it on for a
  # simulated LiDAR: a rendered scan really is instantaneous, so zero offsets are the
  # correct reading rather than a fallback.
  allow_untimed: false

# The robot base. Only `frame` is free-standing; the three switches below all need
# lidar.frame -> base.frame to be resolvable in TF, which the node reads once at startup.
base:
  frame: "base_link"
  # true: report base.frame on the odometry topic instead of imu.frame, with the pose
  # composed as T_world_imu * T_imu_base. Use when a downstream filter wants the base pose
  # directly, with no transform of its own between the message's child frame and its base.
  # The message is withheld, not mislabelled, until the transform resolves.
  odom_in_base: false
  # true: put the world origin on base.frame's initial pose rather than the IMU's, so the
  # ground plane sits near z = 0 instead of at minus the sensor mounting height. Position
  # only -- the heading is the separate switch below.
  origin_at_base: false
  # true: put the world heading on base.frame too. Initialisation gravity-aligns the world
  # frame, which fixes roll and pitch only (an accelerometer cannot observe yaw), so the
  # world frame otherwise inherits the IMU's startup heading -- and the IMU sits inside the
  # LiDAR housing at whatever yaw the mounting imposes. A sensor seated a quarter turn round
  # therefore puts base.frame 90 degrees off the world frame from the first message.
  # Both this and origin_at_base hold initialisation back until the transform resolves: the
  # world frame they define cannot be applied after the map has been built in another one.
  heading_at_base: false

# The LiDAR -> IMU extrinsic. Sensor config files normally give it as explicit vectors:
#
#   calibration:
#     translation: [x, y, z]
#     rotation: [r00, r01, r02, r10, r11, r12, r20, r21, r22]
#
# from_tf is the alternative: read it at startup from TF as imu.frame -> lidar.frame, and
# leave the vectors out. The offset between those two links is a property of the sensor, so
# a robot description that already models both is a better home for it than a second copy
# here that nothing checks against the first -- but it does mean the description has to
# actually contain the IMU link, and that a bag replay (no live TF) cannot use it. Off by
# default; with it off the vectors stay mandatory and a missing one is a hard error rather
# than a silent identity.
calibration:
  from_tf: false

# What goes onto TF. The topics themselves are not optional.
publish:
  # false: publish the odometry but do not broadcast it as a transform. Turn this off when
  # another node (e.g. a robot_localization EKF) already owns that edge -- two publishers on
  # one TF edge make lookups depend on message arrival order. The child frame follows the
  # odometry message, so with base.odom_in_base set this edge is map -> base rather than
  # map -> imu.
  tf: true
  # true: also broadcast a static imu.frame -> lidar.frame transform from the calibration
  # extrinsic. Off by default: a robot description usually already publishes that edge.
  tf_lidar: false

debug:
  publish_all_clouds: False # Publish all clouds (fine, coarse, deskewed)
  timing: False
  log: False
  dashboard: True # Fancy live status print (position, biases, timing, ...)
  dashboard_ascii_path: "" # ASCII art for the dashboard. Empty = bievr_ascii.txt next to the config.
  trajectory_path: "" # Path to save trajectory. If empty, logs will not be saved.

max_num_threads: 0 # 0 = automatic, >0 = number of threads to use for parallel processing